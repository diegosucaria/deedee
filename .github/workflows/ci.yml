name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

# Pull requests run agent-written code (self-improvement). The job token only
# reads, and no step leaves it in .git/config for a test to find.
permissions:
  contents: read

jobs:
  pii-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0

      # Pull requests: only the lines this branch adds.
      - name: Scan added lines
        if: github.event_name == 'pull_request'
        run: node scripts/check-pii.js --range origin/master...HEAD --fix-hints

      # Pushes to master: every tracked text file.
      - name: Scan the whole tree
        if: github.event_name == 'push'
        run: node scripts/check-pii.js --fix-hints

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm

      - run: npm ci

      - run: npm test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm

      - run: npm ci

      - run: npm run build

  # Starts the real browser MCP server on the same Alpine image as the agent
  # container and drives it: navigate, snapshot, screenshot, CDP port.
  browser-smoke:
    runs-on: ubuntu-latest
    container: node:24.18.0-alpine
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - run: apk add --no-cache chromium nss freetype harfbuzz ca-certificates ttf-freefont python3 make g++

      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      - run: node apps/agent/scripts/browser-smoke.js
        env:
          BROWSER_EXECUTABLE_PATH: /usr/bin/chromium-browser
