name: Deploy to Balena

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      # Pin the toolchain. balena-cli 25.x requires Node >=24.11; without an
      # explicit Node + CLI version the runner silently fell back to an old
      # build (22.5.5) that fails auth against the current Balena API with
      # ERR_STREAM_PREMATURE_CLOSE, surfacing as a misleading
      # "Token authentication failed". See PR for the full diagnosis.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Balena CLI
        run: npm install -g balena-cli@25.1.10

      - name: Balena Login
        env:
          BALENA_TOKEN: ${{ secrets.BALENA_API_TOKEN }}
        run: balena login --token "$BALENA_TOKEN"

      - name: Balena Push
        env:
          BALENA_FLEET: ${{ secrets.BALENA_FLEET_SLUG }}
        run: balena push "$BALENA_FLEET" -s . --noparent-check --unsupported
