version: '2.1'

volumes:
  repo-data:
  supervisor-state: # Supervisor-only: .last_boot_commit, .last_assessed_commit, .last_rollback_commit. The agent must not reach it.
  agent-data: # For SQLite DB
  interfaces-data: # For WhatsApp Sessions
  web-data: # For auth.json (login password hash + passkeys). Do NOT include in backups.

services:
  agent:
    build:
      context: .
      dockerfile: apps/agent/Dockerfile
    environment:
      - NODE_ENV=production
      - SUPERVISOR_URL=http://supervisor:4000
      - INTERFACES_URL=http://interfaces:5000
      # All persistent files (agent.db, rag.db, journal, vaults, covers) live on
      # the agent-data volume. Without this rag.db fell back to the working dir
      # and was rebuilt after every release.
      - DATA_DIR=/app/data
      # runShellCommand children start with PATH, HOME, TZ and LANG only, and
      # MCP servers with a fixed base plus their own config block. Add names
      # here (comma separated) when a command or server needs more:
      # - SHELL_ENV_PASSTHROUGH=
      # - MCP_ENV_PASSTHROUGH=
      # DEEDEE_INTERNAL_TOKEN required at runtime — agent rejects /internal/*
      # callers without a matching bearer token, and sends it to the
      # interfaces service. Inject via Balena/.env.
      # SUPERVISOR_TOKEN also required — sent on every call to the supervisor.
      - RATE_LIMIT_HOURLY=50
      - RATE_LIMIT_DAILY=500
      - MAX_TOOL_LOOPS=50
      # Gemini model roles. Balena device/fleet variables override these values,
      # so a bad model id is fixed from the Balena dashboard: set the old id on the
      # device, restart the agent. That is the rollback path; no redeploy needed.
      # Roles, prices and the smoke check: docs/models.md.
      - ROUTER_MODEL=gemini-3.1-flash-lite
      # - ROUTER_MODEL=gemini-3.5-flash-lite
      - WORKER_LITE=gemini-3.1-flash-lite
      # - WORKER_LITE=gemini-3.5-flash-lite
      - WORKER_FLASH=gemini-3.6-flash
      # - WORKER_FLASH=gemini-3.8-flash # same price, no MINIMAL thinking level
      # - WORKER_FLASH=gemini-3-flash-preview # previous default
      - WORKER_PRO=gemini-3.1-pro-preview
      - GEMINI_TTS_MODEL=gemini-2.5-flash-preview-tts
      # - GEMINI_TTS_MODEL=gemini-3.1-flash-tts-preview # 2x the price
      - GEMINI_IMAGE_MODEL=gemini-3-pro-image
      # - GEMINI_IMAGE_MODEL=gemini-3.1-flash-image # half the price per image, lighter model
      - WORKER_GOOGLE_SEARCH=gemini-3.6-flash
      # - WORKER_GOOGLE_SEARCH=gemini-2.5-pro # previous default
      - WORKER_LIVE=gemini-3.8-live
      # - WORKER_LIVE=gemini-2.5-flash-native-audio-preview-12-2025 # previous default
      - GEMINI_EMBEDDING_MODEL=gemini-embedding-2
      # Changing the embedding model re-embeds the whole RAG index in the background.
      - EMBEDDING_DIMENSIONS=1536
    volumes:
      - repo-data:/app/source
      - agent-data:/app/data
      # interfaces-data is NOT mounted here. It holds the WhatsApp session
      # credentials. What the agent needs from it (message bodies for memory
      # consolidation) comes from the interfaces service over
      # /internal/whatsapp/messages-by-date, with DEEDEE_INTERNAL_TOKEN.
    # Chromium (browser MCP) uses /dev/shm; the Docker default of 64m is too small.
    shm_size: 256m
    networks:
      - deedee-net
    restart: always
    tty: true

  supervisor:
    build:
      context: .
      dockerfile: apps/supervisor/Dockerfile
    environment:
      - GIT_USER_NAME=Deedee Agent
      - GIT_USER_EMAIL=deedee@bot
      - PORT=4000
      - SUPERVISOR_STATE_DIR=/app/state
      # SUPERVISOR_TOKEN required at runtime — the supervisor refuses every
      # request when it is unset. Inject via Balena/.env; agent and api send
      # it as X-Supervisor-Token.
      # GIT_REMOTE_URL (https GitHub URL) and GITHUB_PAT: self-improvement
      # pushes a deedee/self/<time> branch and opens a pull request; the token
      # needs contents and pull requests write. It never pushes master.
      # - SUPERVISOR_ROLLBACK_WINDOW_MINUTES=60
    volumes:
      - repo-data:/app/source
      # Also holds the supervisor's own git dir (repo.git): hooks and config
      # the agent cannot write.
      - supervisor-state:/app/state
    labels:
      # Container logs come from the balena supervisor API (journal). No
      # engine socket: the socket could start a privileged container, which
      # is root on the device. For local Docker, mount
      # /var/run/docker.sock in an override file to get logs.
      io.balena.features.supervisor-api: '1'
    networks:
      - deedee-net
    restart: always
    tty: true

  interfaces:
    build:
      context: .
      dockerfile: apps/interfaces/Dockerfile
    environment:
      - NODE_ENV=production
      - AGENT_URL=http://agent:3000
      - PORT=5000
      - DATA_DIR=/app/data
      # TELEGRAM_TOKEN, SLACK_TOKEN, DEEDEE_API_TOKEN injected by Balena.
      # DEEDEE_INTERNAL_TOKEN also required — interfaces injects it on
      # outbound calls to agent /internal/* (sessions, history, etc.).
    volumes:
      - interfaces-data:/app/data
    networks:
      - deedee-net
    restart: always
    tty: true

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      - NODE_ENV=production
      - AGENT_URL=http://agent:3000
      - INTERFACES_URL=http://interfaces:5000
      - PORT=3001
      # Required at runtime (inject via Balena/.env, never bake into the image):
      #   DEEDEE_API_TOKEN        — bearer for /v1/* (iOS Shortcuts etc.)
      #   DEEDEE_INTERNAL_TOKEN   — bearer for agent /internal/*
      #   SUPERVISOR_TOKEN        — X-Supervisor-Token on calls to the supervisor
      #   SESSION_SECRET          — must match the web service; verifies the
      #                             session cookie on /socket.io upgrade
      #   WEB_ORIGIN              — UI origin, used for CORS with credentials
    ports:
      - "3001:3001"
    networks:
      - deedee-net
    restart: always
    tty: true

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      - NODE_ENV=production
      - PORT=3000
      - API_URL=http://api:3001
      - AUTH_DATA_DIR=/app/data
      # Required at runtime (inject via Balena/.env, never bake into the image):
      #   DEEDEE_API_TOKEN        — server-side fetchAPI bearer (token never reaches the browser)
      #   DEEDEE_INTERNAL_TOKEN   — bearer added when proxying to agent /internal/*
      #   SESSION_SECRET          — 32+ random bytes; signs the session JWT
      #   WEB_ORIGIN              — public origin of the UI (https://deedee.example.com)
      #   WEBAUTHN_RP_ID          — passkey relying-party id (e.g. deedee.example.com)
      #   WEBAUTHN_ORIGIN         — must equal WEB_ORIGIN; passkeys require https or localhost
      #   COOKIE_DOMAIN           — set to .example.com only for the two-subdomain layout;
      #                             leave unset when web and api share a domain
      #   LOGIN_PASSWORD          — optional. If set, hashed into auth.json on every boot.
      #                             Acts as the bootstrap and recovery path. Unset it after
      #                             you've enrolled a passkey if you'd rather not have it
      #                             living in env.
      #   SOCKET_URL              — public URL of the api gateway for browser WS connects
      #                             (e.g. https://api.example.com). Read server-side and
      #                             emitted via window.__DEEDEE_CONFIG__.
    volumes:
      # Persists auth.json (password hash + enrolled passkeys + signed-out
      # JTI list). Do NOT include this volume in any backup — losing it
      # means setting LOGIN_PASSWORD again, restarting, and re-enrolling
      # passkeys, which is fine. Including it in a backup leaks the
      # password hash and credential public keys.
      - web-data:/app/data
    ports:
      - "3002:3000"
    networks:
      - deedee-net
    restart: always
    tty: true

  # cloudbeaver:
  #   image: dbeaver/cloudbeaver:latest
  #   ports:
  #     - "8080:8978"
  #   volumes:
  #     - agent-data:/mnt/agent-data
  #     - interfaces-data:/mnt/interfaces-data
  #   networks:
  #     - deedee-net
  #   restart: always

networks:
  deedee-net:
    driver: bridge
